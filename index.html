<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DR Demo Web App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0078d4;
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: rgba(255,255,255,0.15);
      padding: 30px 40px;
      border-radius: 10px;
      text-align: center;
    }
    .region {
      margin-top: 15px;
      padding: 8px 16px;
      background: #00e5ff;
      color: #003a5d;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Disaster Recovery Demo</h1>
    <p>Azure App Service Frontend</p>
    <div class="region" id="region">Detecting region...</div>
  </div>

  <script>
    const region = "{{REGION_NAME}}";
    document.getElementById("region").innerText = region;
  </script>
</body>
</html>
