name: Deploy static HTML to Azure Web App - webapp-secondary

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F311644F2AF1412490AA80D66C5AF6B3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_11B2B903DD8C45E38D2168B3A8C59480 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FFE01480A1C9426DB03E1D13E2078A3C }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: webapp-secondary
          slot-name: Production
          package: .
